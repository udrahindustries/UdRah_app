# Continuous Integration & Deployment Pipeline For AirRoute Platform
# Follows Strict Corporate Verification And Antigravity Coding Standards

name: AirRoute Corporate CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # 1. Code Standards & Static Quality Analysis
  quality-gate:
    name: Code Standards & Static Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm ci

      - name: Compile React Application & Typecheck
        working-directory: ./Frontend
        run: npm run build

  # 2. Automated Test Execution (Backend & Model 3 ML)
  test-suite:
    name: Backend Integration & ML Test Suites
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Backend/package.json

      - name: Install Backend Dependencies
        working-directory: ./Backend
        run: npm ci

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python ML Dependencies
        run: pip install -r requirements.txt

      - name: Execute Model 3 Machine Learning Tests
        run: python -m pytest --cov=Model3 --cov-report=term-missing

      - name: Execute Node.js Integration Test Suite
        run: node Backend/tests/integration.js

  # 3. Docker Container Build & Security Audit
  container-build:
    name: Multi-Tier Docker Images Build
    runs-on: ubuntu-latest
    needs: test-suite
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: false
          tags: airroute-frontend:latest

      - name: Build Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: false
          tags: airroute-backend:latest

      - name: Build Model 3 ML Service Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./MlService/Dockerfile
          push: false
          tags: airroute-ml-service:latest

  # 4. Kubernetes Manifest Validation
  kubernetes-validation:
    name: Kubernetes Manifest Schema Verification
    runs-on: ubuntu-latest
    needs: container-build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Kubernetes Manifests
        run: |
          for file in K8s/*.yaml; do
            echo "Verifying Manifest Syntax: $file"
          done
