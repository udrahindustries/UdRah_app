# Kubernetes ML Service (FastAPI Model 3 Spatial AQI Engine)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airroute-ml-service
  namespace: airroute-system
  labels:
    app: airroute-ml-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: airroute-ml-service
  template:
    metadata:
      labels:
        app: airroute-ml-service
    spec:
      containers:
        - name: ml-engine
          image: airroute-ml-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: airroute-ml-service
  namespace: airroute-system
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: airroute-ml-service
