# Kubernetes Frontend Service Deployment (Nginx Reverse Proxy & React SPA)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airroute-frontend
  namespace: airroute-system
  labels:
    app: airroute-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: airroute-frontend
  template:
    metadata:
      labels:
        app: airroute-frontend
    spec:
      containers:
        - name: web-client
          image: airroute-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: airroute-frontend
  namespace: airroute-system
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: airroute-frontend
