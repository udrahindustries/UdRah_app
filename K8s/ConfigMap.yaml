# Kubernetes ConfigMap For AirRoute Platform Configurations
apiVersion: v1
kind: ConfigMap
metadata:
  name: airroute-config
  namespace: airroute-system
  labels:
    app.kubernetes.io/name: airroute
data:
  NODE_ENV: "production"
  PORT: "5000"
  ML_SERVICE_URL: "http://airroute-ml-service.airroute-system.svc.cluster.local:8000"
  REDIS_URL: "redis://airroute-redis.airroute-system.svc.cluster.local:6379"
  CACHE_TTL_SECONDS: "300"
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX_REQUESTS: "120"
