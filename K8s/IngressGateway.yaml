# Kubernetes Ingress Gateway For AirRoute Edge Traffic Routing
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: airroute-ingress
  namespace: airroute-system
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "airroute-backend"
spec:
  rules:
    - host: airroute.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: airroute-backend
                port:
                  number: 5000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: airroute-backend
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: airroute-frontend
                port:
                  number: 80
